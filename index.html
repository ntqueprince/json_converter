<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Excel → endorsementData.js</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>📌 Excel (.xlsx) → endorsementData.js (AUTO Headers)</h1>
      <p>Excel upload karo → output exact endorsementData.js format me milega.</p>

      <div class="row">
        <input type="file" id="fileInput" accept=".xlsx" />
        <button id="btnConvert">Convert</button>
        <button class="secondary" id="btnCopy">Copy JS</button>
        <button class="secondary" id="btnDownload">Download .js</button>
        <button class="secondary" id="btnClear">Clear</button>
      </div>

      <div class="small" id="status">Ready.</div>
      <div class="barWrap"><div class="bar" id="bar"></div></div>

      <div class="summary" id="summary">
        <span>Total input lines: 0</span>
        <span>Output rows: 0</span>
        <span>Errors: 0</span>
      </div>

      <div class="grid">
        <div>
          <h3 class="title">📥 Input Values</h3>
          <textarea id="preview" readonly placeholder="Excel input values will appear here..."></textarea>
        </div>

        <div>
          <h3 class="title">📤 Output endorsementData.js</h3>
          <textarea id="outputJS" readonly placeholder="JS output will appear here..."></textarea>
        </div>
      </div>

      <div class="detailsGrid">
        <div>
          <h3 class="title">Output Values</h3>
          <textarea id="outputValues" readonly placeholder="Converted output values will appear here..."></textarea>
        </div>

        <div>
          <h3 class="title">Errors / Warnings</h3>
          <textarea id="errorLog" readonly placeholder="Errors and warnings will appear here..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
